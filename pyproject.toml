[project]
name = "flexgate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
flexgate = "flexgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flexgate"]
